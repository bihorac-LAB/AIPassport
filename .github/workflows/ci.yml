name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aipassport
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: aipassport_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-for-production-use-only-abcdef
      HASH_SALT: ci-hash-salt-distinct-value
      LLM_PROVIDER: echo
      TEST_DATABASE_URL: postgresql+asyncpg://aipassport:ci_only_password@localhost:5432/aipassport_test
      DATABASE_URL: postgresql+asyncpg://aipassport:ci_only_password@localhost:5432/aipassport_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The manifest is generated from the frontend content, so the backend needs it to seed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate content manifest
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm run export:manifest

      - name: Migrations apply cleanly from an empty database
        working-directory: backend
        run: .venv/bin/alembic upgrade head || alembic upgrade head

      - name: Tests
        working-directory: backend
        run: pytest -q

      - name: Dependency audit
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Frontend (typecheck + build + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      # Also validates the content: exactly two pages per module, unique keys, real section ids.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: No secrets in the published bundle
        working-directory: frontend
        run: |
          if grep -rniE "postgres(ql)?://|SECRET_KEY|GEMINI_API_KEY|-----BEGIN" dist/assets; then
            echo "::error::A secret-looking string is present in the built bundle"
            exit 1
          fi
          echo "Bundle is clean."

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aipassport
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: aipassport
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key-not-for-production-use-only-abcdef
      HASH_SALT: ci-hash-salt-distinct-value
      LLM_PROVIDER: echo
      DATABASE_URL: postgresql+asyncpg://aipassport:ci_only_password@localhost:5432/aipassport
      CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      # Many registrations arrive from one IP during E2E; production keeps the defaults.
      RATE_LIMIT_REGISTER_PER_HOUR: '500'
      RATE_LIMIT_LOGIN_PER_IP: '500'
      RATE_LIMIT_LOGIN_PER_EMAIL: '200'
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and generate manifest
        working-directory: frontend
        run: |
          npm ci
          npm run export:manifest

      - name: Install backend, migrate, and seed
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed

      - name: Start the API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E
        working-directory: frontend
        run: npm run e2e

      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/api.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
