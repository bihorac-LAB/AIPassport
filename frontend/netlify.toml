# Netlify configuration for the AIPassport SPA.
#
# Set VITE_API_BASE_URL per context in the Netlify UI (or below). It is the ONLY variable the
# browser bundle receives — Vite inlines every VITE_* value into the published JavaScript, so a
# database URL, an LLM key, or a JWT secret must never appear here.

[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Skip Playwright browser downloads during the Netlify build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[context.production.environment]
  VITE_API_BASE_URL = "https://api.aipassport.example.edu"

[context.deploy-preview.environment]
  VITE_API_BASE_URL = "https://api-staging.aipassport.example.edu"

[context.branch-deploy.environment]
  VITE_API_BASE_URL = "https://api-staging.aipassport.example.edu"

# ── SPA fallback ──────────────────────────────────────────────────────────────
# Every route is client-rendered, so unknown paths must serve index.html rather than 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers ───────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    # frame-ancestors is deliberately permissive enough for Canvas. Replace the wildcard with your
    # institution's Canvas host before production: frame-ancestors https://ufl.instructure.com
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data:; \
      font-src 'self' data:; \
      connect-src 'self' https://api.aipassport.example.edu https://api-staging.aipassport.example.edu; \
      frame-ancestors 'self' https://*.instructure.com; \
      base-uri 'self'; \
      form-action 'self'; \
      object-src 'none'"""

# Hashed assets are immutable; index.html must never be cached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
