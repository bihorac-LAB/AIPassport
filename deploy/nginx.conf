# Nginx alternative to deploy/Caddyfile (use one, not both).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/aipassport-api
#   sudo ln -s /etc/nginx/sites-available/aipassport-api /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.aipassport.example.edu
#   sudo nginx -t && sudo systemctl reload nginx
#
# Unlike Caddy this needs certbot for certificates and renewal.

upstream aipassport_api {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 16;
}

# Coarse backstop only — the application enforces per-route, per-identity limits.
limit_req_zone $binary_remote_addr zone=aipassport_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.aipassport.example.edu;

    # ACME challenges stay on HTTP; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aipassport.example.edu;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/api.aipassport.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aipassport.example.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;

    # Matches the FastAPI body-size middleware.
    client_max_body_size 1m;
    client_body_timeout 20s;

    access_log /var/log/nginx/aipassport-api.access.log;
    error_log  /var/log/nginx/aipassport-api.error.log warn;

    # Health checks bypass the rate limit so a probe cannot be throttled.
    location ~ ^/(api/v1/)?health(/ready)?$ {
        proxy_pass http://aipassport_api;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=aipassport_api burst=60 nodelay;

        proxy_pass http://aipassport_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Uvicorn runs with --forwarded-allow-ips=127.0.0.1 and reads the left-most entry.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI routes wait on an upstream model.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # CORS is owned by the FastAPI middleware; do not add headers here.
    }
}
